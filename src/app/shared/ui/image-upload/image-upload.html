<div class="flex flex-col gap-1.5">
  @if (label()) {
    <label class="text-[11px] font-semibold text-slate-700 uppercase tracking-wider">{{ label() }}</label>
  }

  <div class="relative w-28">
    <!-- Interactive image card: click to pick, hover to replace (matches profile & product media) -->
    <div
      (click)="!uploading() && fileInput.click()"
      class="group relative flex h-28 w-28 items-center justify-center overflow-hidden rounded-2xl border transition-all"
      [class.cursor-pointer]="!uploading()"
      [class.border-dashed]="!value() && !uploading()"
      [class.border-slate-300]="!value() && !uploading()"
      [class.hover:border-brand-500]="!uploading()"
      [class.bg-slate-50]="!value() && !uploading()"
      [class.hover:bg-brand-50]="!value() && !uploading()"
      [class.border-slate-200]="value() || uploading()"
      [class.shadow-2xs]="value()"
    >
      @if (uploading()) {
        <!-- Uploading overlay: spinner + percent + progress bar -->
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-1.5 bg-slate-900/55 p-2 text-white">
          <svg class="h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span class="text-[10px] font-extrabold">{{ progress() }}%</span>
          <div class="h-1 w-full max-w-[70px] overflow-hidden rounded-full bg-slate-700/70">
            <div class="h-1 rounded-full bg-brand-500 transition-all duration-300" [style.width.%]="progress()"></div>
          </div>
        </div>
      } @else if (value()) {
        <!-- Preview image with hover scale + replace overlay -->
        <img
          [src]="previewUrl() || value()"
          alt="Preview"
          class="h-full w-full transition-transform duration-300 group-hover:scale-105"
          [class.object-cover]="fit() === 'cover'"
          [class.object-contain]="fit() === 'contain'"
          onerror="this.style.display='none'"
        />
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-1 bg-slate-900/45 text-white opacity-0 transition-opacity group-hover:opacity-100">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z" />
          </svg>
          <span class="text-[10px] font-bold uppercase tracking-wider">Replace</span>
        </div>
      } @else {
        <!-- Empty drop state -->
        <div class="flex flex-col items-center justify-center gap-1 text-slate-400 transition-colors group-hover:text-brand-600">
          <div class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100/80 transition-colors group-hover:bg-brand-50">
            <svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
          </div>
          <span class="text-[9.5px] font-bold uppercase tracking-wider">Upload</span>
        </div>
      }
    </div>

    <!-- Overflowing red remove badge -->
    @if (value() && !uploading()) {
      <button
        type="button"
        (click)="clear()"
        class="absolute -top-1.5 -right-1.5 z-10 flex h-5 w-5 scale-100 items-center justify-center rounded-full border border-white bg-red-500 text-white shadow-md transition-all hover:scale-110 hover:bg-red-600 cursor-pointer"
        title="Remove Image"
      >
        <svg class="h-2.5 w-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    }

    <input #fileInput type="file" [accept]="accept()" (change)="onFileSelected($event)" class="hidden" [disabled]="uploading()" />
  </div>

  <span class="text-[10px] font-medium text-slate-400">PNG, JPG, or SVG.</span>
</div>
