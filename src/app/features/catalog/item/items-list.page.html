<div class="flex flex-col h-full lg:h-[calc(100vh-96px)] overflow-y-auto lg:overflow-hidden gap-4 pb-4">
  <!-- Header -->
  <div class="flex items-center justify-between flex-wrap gap-3 shrink-0">
    <div class="flex flex-col gap-0.5">
      <p class="page-subtitle uppercase tracking-wider text-[10px] font-bold text-slate-400">Catalog</p>
      <div class="flex items-center gap-2.5">
        <h1 class="page-title">Items & Inventory</h1>
        @if (itemCount()) {
          <span class="text-[11px] font-bold text-slate-400 bg-slate-100 border border-slate-200/50 px-2.5 py-0.5 rounded-full mt-1.5">{{ itemCount() }} total</span>
        }
      </div>
    </div>
    <button (click)="newItem()" class="btn-primary h-8.5 px-3.5 text-[12px] font-semibold rounded-xl gap-1.5 shadow-md shadow-brand-500/10 hover:shadow-brand-500/25 transition-all">
      <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
      New Item
    </button>
  </div>

  <!-- Filters -->
  <div class="fluent-card p-4">
    <div class="flex flex-wrap items-end gap-x-3 gap-y-3">
      <!-- Search -->
      <div class="flex flex-col gap-1.5 flex-1 min-w-[220px]">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-0.5">Search</label>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-3.5 w-3.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          <input [value]="search()" (input)="search.set($any($event.target).value)" (keyup.enter)="searchNow()" placeholder="Search by item name…"
            class="h-9 w-full !pl-9 !pr-3.5 border border-slate-200 !rounded-xl focus:border-brand-600 focus:!ring-4 focus:!ring-brand-500/10 bg-slate-50/50 hover:bg-slate-50 transition-all text-[12.5px]" />
        </div>
      </div>

      <!-- Category -->
      <div class="flex flex-col gap-1.5 w-44">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-0.5">Category</label>
        <app-select [options]="categories()" labelKey="name" valueKey="id" [value]="categoryFilter()"
          (valueChange)="categoryFilter.set($event); searchNow()" defaultLabel="- All Categories -" [defaultValue]="0" [searchable]="true" />
      </div>

      <!-- Brand -->
      <div class="flex flex-col gap-1.5 w-44">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-0.5">Brand</label>
        <app-select [options]="brands()" labelKey="name" valueKey="id" [value]="brandFilter()"
          (valueChange)="brandFilter.set($event); searchNow()" defaultLabel="- All Brands -" [defaultValue]="0" [searchable]="true" />
      </div>

      <!-- Status -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider pl-0.5">Status</label>
        <div class="flex items-center h-9 gap-0.5 bg-slate-100/80 rounded-xl p-1 border border-slate-200/40">
          @for (s of activeOptions; track s.id) {
            <button (click)="setActive(s.id)" class="h-full px-3.5 rounded-lg text-[12px] font-bold transition-all"
              [class]="activeFilter() === s.id ? 'bg-white text-slate-800 shadow-xs' : 'text-slate-500 hover:text-slate-800'">{{ s.name }}</button>
          }
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-end gap-2 ml-auto">
        <button (click)="searchNow()" class="btn-primary h-9 px-4 text-[12px] font-semibold rounded-xl gap-1.5">
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          Search
        </button>
        @if (hasActiveFilters()) {
          <button (click)="clearFilters()"
            (mouseenter)="tooltip.show($event, 'Clear Filters', { info: 'Reset search, category, brand, and status to defaults.' })"
            (mouseleave)="tooltip.hide()"
            class="btn-secondary h-9 px-4 text-[12px] font-semibold rounded-xl gap-1.5">
            <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            Clear
          </button>
        }
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="flex-1 min-h-0 flex flex-col gap-4">
    <app-data-table
      [columns]="columns"
      [rows]="rows()"
      [loading]="loading()"
      [searchable]="false"
      emptyText="No items found."
      [actions]="itemActions"
      [fillHeight]="true"
      (tableScroll)="onTableScroll($event)"
      [loadingMore]="loadingMore()"
    />
    <ng-template #itemActions let-row>
      <button (click)="editItem(row)"
              (mouseenter)="tooltip.show($event, 'Edit Item', { info: 'Edit product details, pricing, variants, and settings.', placement: 'left' })"
              (mouseleave)="tooltip.hide()"
              class="flex h-7.5 w-7.5 items-center justify-center rounded-lg text-brand-600 hover:bg-brand-50 border border-slate-200/40 hover:border-brand-200/50 bg-white shadow-2xs hover:shadow-xs transition-all cursor-pointer"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
        </svg>
      </button>
    </ng-template>
  </div>
</div>
